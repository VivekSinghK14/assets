<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Impact at a glance">
<style>
  .card{animation:up .9s ease-out backwards}
  @keyframes up{from{opacity:0;transform:translateY(18px)}}
  .box{fill:#09101a;stroke:#00ffe0;stroke-opacity:.35;stroke-width:1.2;animation:glow 4s ease-in-out infinite}
  @keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.9}}
  .num{font:800 48px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#00ffe0}
  .lbl{font:700 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffffff}
  .sub{font:500 12.5px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8aa3a8}
</style>
<g class="card" style="animation-delay:0.0s">
  <rect class="box" x="1" y="5" width="228" height="140" rx="16" style="animation-delay:0.0s"/>
  <rect x="21" y="5" width="188" height="3" rx="1.5" fill="#00ffe0"/>
  <text class="num" x="116.0" y="68" text-anchor="middle">5+</text>
  <text class="lbl" x="116.0" y="98" text-anchor="middle">SAP HANA clients</text>
  <text class="sub" x="116.0" y="122" text-anchor="middle">AI solutions architected · 2024</text>
</g><g class="card" style="animation-delay:0.25s">
  <rect class="box" x="257" y="5" width="228" height="140" rx="16" style="animation-delay:0.6s"/>
  <rect x="277" y="5" width="188" height="3" rx="1.5" fill="#00ffe0"/>
  <text class="num" x="372.0" y="68" text-anchor="middle">3+</text>
  <text class="lbl" x="372.0" y="98" text-anchor="middle">Enterprise projects</text>
  <text class="sub" x="372.0" y="122" text-anchor="middle">ABAP on SAP BTP · 2023-2024</text>
</g><g class="card" style="animation-delay:0.5s">
  <rect class="box" x="513" y="5" width="228" height="140" rx="16" style="animation-delay:1.2s"/>
  <rect x="533" y="5" width="188" height="3" rx="1.5" fill="#00ffe0"/>
  <text class="num" x="628.0" y="68" text-anchor="middle">1.7</text>
  <text class="lbl" x="628.0" y="98" text-anchor="middle">M.Sc. grade</text>
  <text class="sub" x="628.0" y="122" text-anchor="middle">Digital Engineering · Germany</text>
</g><g class="card" style="animation-delay:0.75s">
  <rect class="box" x="769" y="5" width="228" height="140" rx="16" style="animation-delay:1.7999999999999998s"/>
  <rect x="789" y="5" width="188" height="3" rx="1.5" fill="#00ffe0"/>
  <text class="num" x="884.0" y="68" text-anchor="middle">80%</text>
  <text class="lbl" x="884.0" y="98" text-anchor="middle">B.Tech score</text>
  <text class="sub" x="884.0" y="122" text-anchor="middle">Computer Science &amp; Engineering</text>
</g>
</svg>
