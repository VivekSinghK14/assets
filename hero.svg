  .scan{animation:sweep 8s linear infinite}
  @keyframes sweep{from{transform:translateX(-60px)}to{transform:translateX(1000px)}}
  .edges line{stroke:#00ffe0;stroke-opacity:.13;stroke-width:1}
</style>
